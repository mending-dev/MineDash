<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MineDash</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6;
            display: grid; place-items: center; min-height: 100vh; margin: 0; }
        form { display: grid; gap: 8px; width: 260px; }
        input, button { padding: 8px; border-radius: 6px; border: 1px solid #333;
            background: #181b22; color: inherit; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
<form id="form">
    <h2>MineDash</h2>
    <input id="username" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button type="submit">Login</button>
    <button type="button" id="me">Check session</button>
    <pre id="out"></pre>
</form>
<script>
  // Temporary test page for the auth API
  const out = document.getElementById('out');
  const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    out.textContent = res.status + ' ' + await res.text();
  });

  document.getElementById('me').addEventListener('click', async () => {
    const res = await fetch('/api/auth/me', { headers });
    out.textContent = res.status + ' ' + await res.text();
  });
</script>
</body>
</html>
